services:
    _defaults:
        autoconfigure: true
        autowire: true
        public: false

    Reluem\ContaoUIkitBundle\EventListener\generatePageHook:
        tags:
            - { name: contao.hook, hook: generatePage, method: assetDelivery }

    Reluem\ContaoUIkitBundle\EventListener\TabControlHook:
        tags:
            - { name: contao.hook, hook: tabControlJS, method: TabControlJS }
